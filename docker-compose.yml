services:
  postgres:
    image: postgres:17-alpine
    container_name: obraflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
      POSTGRES_DB: obraflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U obraflow -d obraflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
